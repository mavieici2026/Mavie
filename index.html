<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MA VIE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#fff}
.hide{display:none!important}
.mut{color:#999}.c{text-align:center}
.btn{background:#fff;color:#000;border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn.s{background:#1a1a1a;color:#fff;border:1px solid #333}
.btn.sm{width:auto;padding:8px 14px;font-size:14px}
.inp{width:100%;background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin:6px 0}
textarea.inp{min-height:80px;resize:vertical}
#auth{position:fixed;inset:0;overflow:auto;padding:24px;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto}
.logo{width:96px;height:96px;border:3px solid #fff;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;line-height:1;font-size:26px;letter-spacing:1px}
.sec{position:fixed;left:0;right:0;top:0;bottom:calc(64px + env(safe-area-inset-bottom));overflow:auto;background:#000}
.pad{padding:16px;max-width:560px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(64px + env(safe-area-inset-bottom));display:flex;background:#000;border-top:1px solid #222;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:#888;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .i{font-size:22px}
nav button.on{color:#fff}
#feed{overflow:hidden}
#tabs{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:center;gap:22px;padding:calc(14px + env(safe-area-inset-top)) 12px 10px;text-shadow:0 1px 4px #000}
#tabs button{background:none;border:0;color:#bbb;font-size:17px;font-weight:600;padding:4px 2px;border-bottom:2px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#fff}
#msgBtn{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));font-size:22px;background:none;border:0}
#feedList{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000}
.card video{width:100%;height:100%;object-fit:contain;background:#000}
.side{position:absolute;right:10px;bottom:150px;display:flex;flex-direction:column;gap:14px;align-items:center}
.act{width:52px;background:rgba(40,40,40,.75);border:0;border-radius:26px;padding:8px 0;font-size:24px;display:flex;flex-direction:column;align-items:center}
.act span{font-size:12px;margin-top:2px}
.info{position:absolute;left:12px;right:80px;bottom:78px;text-shadow:0 1px 4px #000}
.info .who{font-weight:700;cursor:pointer}
.info p{margin:6px 0;font-size:14px}
.fbtn{margin-left:8px;border:1px solid #fff;background:rgba(0,0,0,.4);border-radius:8px;padding:3px 10px;font-size:13px}
#sound{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;color:#000;border:0;border-radius:14px;padding:14px;font-weight:600;z-index:5}
.vw{font-size:13px;color:#ddd}
.av{border-radius:50%;object-fit:cover;background:#222;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1c1c1c}
.row .g{flex:1;min-width:0}
.row .g div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;justify-content:space-around;text-align:center;margin:14px 0}
.stats b{display:block;font-size:20px}
.box{background:#111;border:1px solid #262626;border-radius:14px;padding:14px;margin:12px 0}
.vid{background:#111;border:1px solid #262626;border-radius:14px;padding:10px;margin:10px 0}
.vid video{width:100%;max-height:300px;border-radius:10px;background:#000}
.sheet{position:fixed;left:0;right:0;bottom:0;height:70%;background:#111;border-top:1px solid #333;border-radius:18px 18px 0 0;z-index:50;display:flex;flex-direction:column}
.sheet .h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #222}
.sheet .l{flex:1;overflow:auto;padding:8px 16px}
.sheet .f{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #222}
.x{background:none;border:0;font-size:22px}
.bub{max-width:78%;padding:9px 12px;border-radius:16px;margin:6px 0;font-size:15px;word-break:break-word;background:#1c1c1c}
.bub.me{background:#fff;color:#000;margin-left:auto}
#chat{display:flex;flex-direction:column}
#chatMsgs{flex:1;overflow:auto;padding:8px 14px}
.bar{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #222}
#toast{position:fixed;left:16px;right:16px;bottom:90px;background:#fff;color:#000;padding:12px 14px;border-radius:12px;z-index:99;text-align:center;font-weight:600}
.prog{height:8px;background:#222;border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:0;background:#fff}
</style>
</head>
<body>

<div id="auth" class="hide">
  <div class="logo">MA<br>VIE</div>
  <h2 class="c" style="margin:4px 0 14px">MA VIE</h2>
  <div style="display:flex;gap:8px;margin-bottom:8px">
    <button class="btn s" id="tLogin" style="background:#fff;color:#000">Connexion</button>
    <button class="btn s" id="tSign">Inscription</button>
  </div>
  <input class="inp hide" id="aUser" placeholder="Nom d'utilisateur" maxlength="20" autocapitalize="off">
  <input class="inp" id="aMail" type="email" placeholder="E-mail" autocapitalize="off">
  <input class="inp" id="aPass" type="password" placeholder="Mot de passe (6 caractères minimum)">
  <button class="btn" id="aGo" style="margin-top:8px">Se connecter</button>
  <p id="aErr" class="c" style="color:#ff6b6b;min-height:22px"></p>
  <p class="c mut" style="font-size:13px"><a href="confidentialite.html">Politique de confidentialité</a></p>
</div>

<div id="app" class="hide">
  <section id="feed" class="sec">
    <div id="tabs">
      <button id="tPour" class="on">Pour toi</button>
      <button id="tAbo">Abonnements</button>
    </div>
    <button id="msgBtn" title="Messages">✉️</button>
    <div id="feedList"></div>
    <button id="sound">🔇 Appuie pour activer le son</button>
  </section>

  <section id="search" class="sec hide"><div class="pad">
    <input class="inp" id="sq" placeholder="Chercher un créateur, un mot ou un #hashtag" autocapitalize="off">
    <div id="sres"></div>
  </div></section>

  <section id="publish" class="sec hide"><div class="pad">
    <h3>Publier une vidéo</h3>
    <button class="btn s" id="pPick">📁 Choisir une vidéo du téléphone</button>
    <input type="file" id="pFile" accept="video/*" class="hide">
    <p id="pName" class="mut" style="font-size:14px"></p>
    <p class="mut c" style="margin:6px">— ou colle un lien .mp4 —</p>
    <input class="inp" id="pLink" placeholder="https://.../video.mp4" autocapitalize="off">
    <textarea class="inp" id="pDesc" placeholder="Description avec #hashtags" maxlength="300"></textarea>
    <div class="prog hide" id="pProg"><i></i></div>
    <button class="btn" id="pGo">Publier</button>
    <p class="mut" style="font-size:13px">Durée : de 2 secondes à moins de 30 minutes.</p>
    <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:10px"><input type="checkbox" id="pOwn" style="margin-top:3px"> Cette vidéo est à moi (je ne copie pas la vidéo d'un autre).</label>
  </div></section>

  <section id="profile" class="sec hide"></section>

  <section id="inbox" class="sec hide"><div class="pad">
    <div class="bar" style="padding:0 0 12px"><button class="x" id="inBack">←</button><h3 style="margin:0">Messages</h3></div>
    <div id="inList"></div>
  </div></section>

  <section id="chat" class="sec hide">
    <div class="bar"><button class="x" id="chBack">←</button><b id="chName"></b></div>
    <div id="chatMsgs"></div>
    <div class="sheet" style="position:static;height:auto;border:0;border-radius:0;border-top:1px solid #222">
      <div class="f"><input class="inp" id="chIn" placeholder="Écris un message…" style="margin:0" maxlength="500"><button class="btn sm" id="chSend">Envoyer</button></div>
    </div>
  </section>

  <nav>
    <button data-go="feed" class="on"><span class="i">🏠</span>Accueil</button>
    <button data-go="search"><span class="i">🔍</span>Recherche</button>
    <button data-go="publish"><span class="i">➕</span>Publier</button>
    <button data-go="gains"><span class="i">💰</span>Gains</button>
    <button data-go="profile"><span class="i">👤</span>Profil</button>
  </nav>
</div>

<div id="sheetBox"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,getDocs,query,where,orderBy,limit,onSnapshot,writeBatch,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDt_UcyL9pXwvfE-5NpOozMykCJh7zvvrs",
  authDomain: "ma-vie-2b252.firebaseapp.com",
  projectId: "ma-vie-2b252",
  storageBucket: "ma-vie-2b252.firebasestorage.app",
  messagingSenderId: "235933753646",
  appId: "1:235933753646:web:91df8965e68affbf3f9abf"
};
const CLOUD="gevaxyli", PRESET="mavie_videos";
const RATE=100, MIN_WITHDRAW=500; // 100 FCFA pour 1 000 vues (calcul de test)

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ownerOf=p=>p.uid||p.userId||p.authorId||p.ownerId||p.creatorId||"";
const nameOf=p=>p.username||p.author||p.authorName||p.user||"inconnu";
const urlOf=p=>p.videoUrl||p.url||p.videoURL||p.video||"";
const descOf=p=>p.desc||p.caption||p.description||p.text||"";

let me=null, myData={}, following=new Set(), tab="pour", soundOn=false, posts=[], current="feed";
let observer=null, chatUnsub=null, commUnsub=null;
const seen=new Set();

function toast(m){const t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function errMsg(e){
  const c=e?.code||"";
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(c))return "E-mail ou mot de passe incorrect.";
  if(c==="auth/email-already-in-use")return "Cet e-mail est déjà utilisé.";
  if(c==="auth/weak-password")return "Mot de passe trop court (6 caractères minimum).";
  if(c==="auth/invalid-email")return "E-mail non valide.";
  if(c==="auth/network-request-failed")return "Pas de connexion internet.";
  if(c.includes("permission-denied"))return "Permission refusée par les règles Firestore.";
  return e?.message||"Erreur";
}
function avatar(url,name,size=44){
  if(url)return `<img class="av" src="${esc(url)}" width="${size}" height="${size}" style="width:${size}px;height:${size}px" alt="">`;
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${size*0.42}px">${esc((name||"?").charAt(0).toUpperCase())}</span>`;
}

/* ---------- Connexion / inscription ---------- */
let signMode=false;
function setMode(s){
  signMode=s;
  $("#aUser").classList.toggle("hide",!s);
  $("#aGo").textContent=s?"Créer mon compte":"Se connecter";
  $("#tLogin").style.cssText=s?"":"background:#fff;color:#000";
  $("#tSign").style.cssText=s?"background:#fff;color:#000":"";
  $("#aErr").textContent="";
}
$("#tLogin").onclick=()=>setMode(false);
$("#tSign").onclick=()=>setMode(true);
$("#aGo").onclick=async()=>{
  const mail=$("#aMail").value.trim(), pass=$("#aPass").value, user=$("#aUser").value.trim();
  $("#aErr").textContent="";
  try{
    if(signMode){
      if(user.length<3){$("#aErr").textContent="Nom d'utilisateur : 3 caractères minimum.";return}
      const cr=await createUserWithEmailAndPassword(auth,mail,pass);
      await setDoc(doc(db,"users",cr.user.uid),{username:user,bio:"",photoURL:"",createdAt:serverTimestamp()});
    }else{
      await signInWithEmailAndPassword(auth,mail,pass);
    }
  }catch(e){$("#aErr").textContent=errMsg(e)}
};

onAuthStateChanged(auth,async u=>{
  me=u;
  if(!u){$("#app").classList.add("hide");$("#auth").classList.remove("hide");return}
  try{
    const s=await getDoc(doc(db,"users",u.uid));
    if(s.exists())myData=s.data();
    else{myData={username:(u.email||"utilisateur").split("@")[0],bio:"",photoURL:""};await setDoc(doc(db,"users",u.uid),{...myData,createdAt:serverTimestamp()})}
  }catch(e){myData={username:(u.email||"utilisateur").split("@")[0]};toast(errMsg(e))}
  $("#auth").classList.add("hide");$("#app").classList.remove("hide");
  go("feed");
});

/* ---------- Navigation ---------- */
function go(name){
  if(name==="gains"){location.href="gains.html";return}
  $$("#feedList video").forEach(v=>v.pause());
  if(chatUnsub&&name!=="chat"){chatUnsub();chatUnsub=null}
  current=name;
  $$(".sec").forEach(s=>s.classList.add("hide"));
  $("#"+name).classList.remove("hide");
  $$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===name));
  if(name==="feed")showFeed();
  if(name==="profile")renderProfile(me.uid,$("#profile"));
  if(name==="inbox")showInbox();
}
$$("nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("#msgBtn").onclick=()=>go("inbox");
$("#inBack").onclick=()=>go("feed");

/* ---------- Données ---------- */
async function loadPosts(){
  const s=await getDocs(query(collection(db,"posts"),limit(200)));
  posts=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>urlOf(p)).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  return posts;
}
async function loadFollowing(){
  try{const s=await getDocs(collection(db,"users",me.uid,"following"));following=new Set(s.docs.map(d=>d.id))}catch(e){}
}
async function countOf(ref){
  const s=await getDocs(ref);return s.size;
}

/* ---------- Fil de vidéos ---------- */
$("#tPour").onclick=()=>{tab="pour";$("#tPour").classList.add("on");$("#tAbo").classList.remove("on");showFeed()};
$("#tAbo").onclick=()=>{tab="abo";$("#tAbo").classList.add("on");$("#tPour").classList.remove("on");showFeed()};
$("#sound").onclick=()=>{
  soundOn=!soundOn;
  $$("#feedList video").forEach(v=>v.muted=!soundOn);
  $("#sound").textContent=soundOn?"🔊 Son activé":"🔇 Appuie pour activer le son";
};

async function showFeed(){
  const box=$("#feedList");
  box.innerHTML='<p class="c mut" style="padding-top:40vh">Chargement…</p>';
  try{await Promise.all([loadPosts(),loadFollowing()])}catch(e){box.innerHTML=`<p class="c" style="padding:40vh 20px 0">${esc(errMsg(e))}</p>`;return}
  let list=posts;
  if(tab==="abo"){
    if(!following.size){box.innerHTML='<p class="c mut" style="padding:40vh 20px 0">Vous ne suivez encore personne.</p>';return}
    list=posts.filter(p=>following.has(ownerOf(p)));
    if(!list.length){box.innerHTML='<p class="c mut" style="padding:40vh 20px 0">Pas encore de vidéos de vos abonnements.</p>';return}
  }
  if(!list.length){box.innerHTML='<p class="c mut" style="padding:40vh 20px 0">Aucune vidéo pour le moment. Appuie sur ➕ pour publier la première !</p>';return}
  box.innerHTML="";
  if(observer)observer.disconnect();
  let timers=new Map();
  observer=new IntersectionObserver(es=>{
    es.forEach(en=>{
      const v=$("video",en.target), p=list.find(x=>x.id===en.target.dataset.id);
      if(en.isIntersecting){
        v.muted=!soundOn;v.play().catch(()=>{});
        timers.set(en.target,setTimeout(()=>countView(p,en.target),1500));
      }else{
        v.pause();
        clearTimeout(timers.get(en.target));
      }
    });
  },{root:box,threshold:0.7});
  list.forEach(p=>box.appendChild(makeCard(p)));
  $$(".card",box).forEach(c=>observer.observe(c));
}

function makeCard(p){
  const own=ownerOf(p)===me.uid, d=document.createElement("div");
  d.className="card";d.dataset.id=p.id;
  d.innerHTML=`<video src="${esc(urlOf(p))}" playsinline loop preload="metadata" muted></video>
  <div class="side">
    <button class="act lk"><b>🤍</b><span>0</span></button>
    <button class="act cm">💬<span>&nbsp;</span></button>
    <button class="act sh">↗️<span>&nbsp;</span></button>
    ${own?"":'<button class="act rp">🚩<span>&nbsp;</span></button>'}
  </div>
  <div class="info">
    <span class="who">@${esc(nameOf(p))}</span>${own?"":`<button class="fbtn">${following.has(ownerOf(p))?"Abonné":"Suivre"}</button>`}
    <p>${esc(descOf(p))}</p>
    <span class="vw">👁 ${p.views||0}</span>
  </div>`;
  const v=$("video",d);
  v.onclick=()=>v.paused?v.play():v.pause();
  $(".who",d).onclick=()=>openUser(ownerOf(p));
  const fb=$(".fbtn",d);
  if(fb)fb.onclick=async()=>{await toggleFollow(ownerOf(p));$$(`.card .fbtn`).forEach(b=>{const c=b.closest(".card"),pp=posts.find(x=>x.id===c.dataset.id);if(pp&&ownerOf(pp)===ownerOf(p))b.textContent=following.has(ownerOf(p))?"Abonné":"Suivre"})};
  // J'aime
  let liked=false, n=0;
  const lk=$(".lk",d), setLk=()=>{$("b",lk).textContent=liked?"❤️":"🤍";$("span",lk).textContent=n};
  (async()=>{try{
    const [c,m]=await Promise.all([countOf(collection(db,"posts",p.id,"likes")),getDoc(doc(db,"posts",p.id,"likes",me.uid))]);
    n=c;liked=m.exists();setLk();
  }catch(e){}})();
  lk.onclick=async()=>{
    const r=doc(db,"posts",p.id,"likes",me.uid);
    try{
      if(liked){await deleteDoc(r);liked=false;n=Math.max(0,n-1)}
      else{await setDoc(r,{createdAt:serverTimestamp()});liked=true;n++}
      setLk();
    }catch(e){toast(errMsg(e))}
  };
  (async()=>{try{const c=await countOf(collection(db,"posts",p.id,"comments"));$(".cm span",d).textContent=c||""}catch(e){}})();
  $(".cm",d).onclick=()=>openComments(p);
  $(".sh",d).onclick=()=>share(p);
  const rp=$(".rp",d);if(rp)rp.onclick=()=>openReport(p);
  return d;
}

async function countView(p,card){
  if(!p||!me||ownerOf(p)===me.uid||seen.has(p.id))return;
  seen.add(p.id);
  try{
    const vr=doc(db,"posts",p.id,"viewers",me.uid);
    if((await getDoc(vr)).exists())return;
    const b=writeBatch(db);
    b.set(vr,{createdAt:serverTimestamp()});
    b.update(doc(db,"posts",p.id),{views:increment(1)});
    await b.commit();
    p.views=(p.views||0)+1;
    const l=$(".vw",card);if(l)l.textContent="👁 "+p.views;
  }catch(e){console.log("vue",e)}
}

async function share(p){
  const url=location.origin+location.pathname.replace(/[^/]*$/,"");
  const data={title:"MA VIE",text:"Regarde cette vidéo sur MA VIE : "+descOf(p),url};
  try{
    if(navigator.share)await navigator.share(data);
    else{await navigator.clipboard.writeText(url);toast("Lien copié")}
  }catch(e){}
}

async function toggleFollow(uid){
  if(!uid||uid===me.uid)return;
  const b=writeBatch(db), a=doc(db,"users",me.uid,"following",uid), z=doc(db,"users",uid,"followers",me.uid);
  try{
    if(following.has(uid)){b.delete(a);b.delete(z);await b.commit();following.delete(uid)}
    else{b.set(a,{createdAt:serverTimestamp()});b.set(z,{createdAt:serverTimestamp()});await b.commit();following.add(uid)}
  }catch(e){toast(errMsg(e))}
}

/* ---------- Commentaires ---------- */
function closeSheet(){if(commUnsub){commUnsub();commUnsub=null}$("#sheetBox").innerHTML=""}
function openComments(p){
  $("#sheetBox").innerHTML=`<div class="sheet"><div class="h"><b>Commentaires</b><button class="x" id="cx">✕</button></div>
  <div class="l" id="cl"><p class="mut c">Chargement…</p></div>
  <div class="f"><input class="inp" id="ci" placeholder="Ajouter un commentaire…" style="margin:0" maxlength="300"><button class="btn sm" id="cs">Envoyer</button></div></div>`;
  $("#cx").onclick=closeSheet;
  commUnsub=onSnapshot(query(collection(db,"posts",p.id,"comments"),orderBy("createdAt")),s=>{
    const l=$("#cl");if(!l)return;
    l.innerHTML=s.empty?'<p class="mut c">Aucun commentaire. Sois le premier !</p>':s.docs.map(d=>{const c=d.data();return `<div class="row"><div class="g"><b>@${esc(c.username||"?")}</b><div style="white-space:normal">${esc(c.text)}</div></div></div>`}).join("");
    l.scrollTop=l.scrollHeight;
  },e=>{const l=$("#cl");if(l)l.innerHTML=`<p class="c">${esc(errMsg(e))}</p>`});
  $("#cs").onclick=async()=>{
    const t=$("#ci").value.trim();if(!t)return;$("#ci").value="";
    try{await addDoc(collection(db,"posts",p.id,"comments"),{uid:me.uid,username:myData.username||"?",text:t,createdAt:serverTimestamp()})}catch(e){toast(errMsg(e))}
  };
}

/* ---------- Signaler ---------- */
function openReport(p){
  const motifs=["Contenu sexuel","Violence ou danger","Harcèlement ou haine","Spam ou arnaque","Autre"];
  $("#sheetBox").innerHTML=`<div class="sheet" style="height:auto"><div class="h"><b>Signaler cette vidéo</b><button class="x" id="cx">✕</button></div>
  <div class="l">${motifs.map(m=>`<button class="btn s" style="margin:6px 0" data-m="${esc(m)}">${esc(m)}</button>`).join("")}</div></div>`;
  $("#cx").onclick=closeSheet;
  $$("#sheetBox [data-m]").forEach(b=>b.onclick=async()=>{
    try{
      await setDoc(doc(db,"reports",p.id+"_"+me.uid),{postId:p.id,reporterUid:me.uid,reason:b.dataset.m,createdAt:serverTimestamp()});
      closeSheet();toast("Merci, ton signalement est envoyé.");
    }catch(e){toast("Signalement impossible : "+errMsg(e))}
  });
}

/* ---------- Publier ---------- */
let pickedFile=null;
$("#pPick").onclick=()=>$("#pFile").click();
$("#pFile").onchange=e=>{pickedFile=e.target.files[0]||null;$("#pName").textContent=pickedFile?("✅ "+pickedFile.name+" ("+(pickedFile.size/1048576).toFixed(1)+" Mo)"):""};
function videoDuration(src){return new Promise(r=>{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>r(v.duration);v.onerror=()=>r(NaN);v.src=src})}
function uploadCloud(file,onProg){
  return new Promise((ok,ko)=>{
    const fd=new FormData();fd.append("file",file);fd.append("upload_preset",PRESET);
    const x=new XMLHttpRequest();
    x.open("POST",`https://api.cloudinary.com/v1_1/${CLOUD}/video/upload`);
    x.upload.onprogress=e=>{if(e.lengthComputable)onProg(e.loaded/e.total)};
    x.onload=()=>{try{const j=JSON.parse(x.responseText);if(x.status<300&&j.secure_url)ok(j.secure_url);else ko(new Error(j.error?.message||"Envoi impossible"))}catch(e){ko(e)}};
    x.onerror=()=>ko(new Error("Pas de connexion internet"));
    x.send(fd);
  });
}
$("#pGo").onclick=async()=>{
  const btn=$("#pGo"), link=$("#pLink").value.trim(), desc=$("#pDesc").value.trim();
  if(!pickedFile&&!link){toast("Choisis une vidéo ou colle un lien.");return}
  if(!$("#pOwn").checked){toast("Coche « Cette vidéo est à moi » pour publier.");return}
  btn.disabled=true;btn.textContent="Envoi…";
  try{
    let url=link;
    if(pickedFile){
      const d=await videoDuration(URL.createObjectURL(pickedFile));
      if(d<2)throw new Error("La vidéo est trop courte (2 secondes minimum).");
      if(d>=1800)throw new Error("La vidéo est trop longue (moins de 30 minutes).");
      $("#pProg").classList.remove("hide");
      url=await uploadCloud(pickedFile,f=>{$("#pProg i").style.width=Math.round(f*100)+"%"});
    }
    await addDoc(collection(db,"posts"),{uid:me.uid,username:myData.username||"?",videoUrl:url,desc,views:0,createdAt:serverTimestamp()});
    pickedFile=null;$("#pFile").value="";$("#pName").textContent="";$("#pLink").value="";$("#pDesc").value="";$("#pOwn").checked=false;
    $("#pProg").classList.add("hide");$("#pProg i").style.width="0";
    toast("Vidéo publiée ✅");go("profile");
  }catch(e){toast(errMsg(e))}
  btn.disabled=false;btn.textContent="Publier";
};

/* ---------- Profil ---------- */
function resizeImage(file,max=256){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};img.onerror=ko;img.src=URL.createObjectURL(file)})}

async function openUser(uid){
  if(!uid)return;
  if(uid===me.uid){go("profile");return}
  $$(".sec").forEach(s=>s.classList.add("hide"));
  $("#feedList video")&&$$("#feedList video").forEach(v=>v.pause());
  $("#profile").classList.remove("hide");
  $$("nav button").forEach(b=>b.classList.remove("on"));
  renderProfile(uid,$("#profile"));
}

async function renderProfile(uid,box){
  box.innerHTML='<p class="mut c" style="padding:40px">Chargement…</p>';
  const isMe=uid===me.uid;
  try{
    let ud=myData;
    if(!isMe)ud=(await getDoc(doc(db,"users",uid))).data()||{username:"inconnu"};
    await loadPosts();
    const mine=posts.filter(p=>ownerOf(p)===uid);
    const [fo,fi]=await Promise.all([getDocs(collection(db,"users",uid,"followers")),getDocs(collection(db,"users",uid,"following"))]);
    if(!isMe)await loadFollowing();
    const views=mine.reduce((s,p)=>s+(p.views||0),0);
    let html=`<div class="pad"><div class="c">${avatar(ud.photoURL,ud.username,96)}<h2 style="margin:8px 0 2px">@${esc(ud.username)}</h2><div class="mut">${esc(ud.bio||"")}</div></div>
    <div class="stats"><div><b>${mine.length}</b>Vidéos</div><div><b>${fo.size}</b>Abonnés</div><div><b>${fi.size}</b>Abonnements</div><div><b>${views}</b>Vues</div></div>`;
    if(!isMe){
      html+=`<div style="display:flex;gap:8px"><button class="btn" id="pFollow">${following.has(uid)?"Abonné":"Suivre"}</button><button class="btn s" id="pMsg">✉️ Message</button></div><button class="btn s" id="pBack" style="margin-top:8px">← Retour</button>`;
    }else{
      let wd=[];
      try{wd=(await getDocs(query(collection(db,"withdrawals"),where("uid","==",uid)))).docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))}catch(e){}
      const earned=Math.floor(views*RATE/1000), taken=wd.filter(w=>w.status!=="Refusé").reduce((s,w)=>s+(Number(w.amount)||0),0), bal=Math.max(0,earned-taken);
      html+=`<div style="display:flex;gap:8px"><button class="btn s" id="pEdit">✏️ Modifier mon profil</button><button class="btn s" id="pInbox">✉️ Messages</button></div>
      <div class="box"><b>Mes gains (estimation)</b><div style="font-size:26px;font-weight:800;margin:6px 0">${bal} FCFA</div>
      <div class="mut" style="font-size:13px">${views} vues · calcul de test : ${RATE} FCFA pour 1 000 vues</div>
      <div class="mut" style="font-size:13px;margin:6px 0">Retrait possible à partir de ${MIN_WITHDRAW} FCFA</div>
      <button class="btn" id="pWd" ${bal<MIN_WITHDRAW?"disabled style='opacity:.4'":""}>Retirer</button></div>`;
      if(wd.length)html+=`<div class="box"><b>Mes demandes de retrait</b>${wd.map(w=>`<div class="row"><div class="g"><div>${esc(w.amount)} FCFA · ${esc(w.method)}</div></div><span>${esc(w.status||"En attente")}</span></div>`).join("")}</div>`;
    }
    html+=`<h3>${isMe?"Mes vidéos":"Vidéos"}</h3>`;
    html+=mine.length?mine.map(p=>`<div class="vid"><video src="${esc(urlOf(p))}" controls playsinline preload="metadata"></video><div style="margin:6px 0;word-break:break-word">${esc(descOf(p))}</div><div class="mut" style="font-size:13px">👁 ${p.views||0} vues</div>${isMe?`<button class="btn s sm" data-del="${esc(p.id)}" style="margin-top:8px">Supprimer</button>`:""}</div>`).join(""):'<p class="mut">Aucune vidéo.</p>';
    if(isMe)html+=`<p class="c" style="margin-top:24px"><button class="btn s" id="pOut">Se déconnecter</button></p><p class="c mut" style="font-size:13px"><a href="confidentialite.html">Politique de confidentialité</a></p>`;
    html+=`<div style="height:20px"></div></div>`;
    box.innerHTML=html;
    // actions
    if(!isMe){
      $("#pFollow").onclick=async()=>{await toggleFollow(uid);renderProfile(uid,box)};
      $("#pMsg").onclick=()=>openChat(uid,ud.username);
      $("#pBack").onclick=()=>go("feed");
    }else{
      $("#pOut").onclick=()=>signOut(auth);
      $("#pInbox").onclick=()=>go("inbox");
      $("#pEdit").onclick=()=>editProfile(box);
      const wdb=$("#pWd");if(wdb&&!wdb.disabled)wdb.onclick=()=>openWithdraw(bal,box);
      $$("[data-del]",box).forEach(b=>b.onclick=async()=>{
        if(!confirm("Supprimer cette vidéo ?"))return;
        try{await deleteDoc(doc(db,"posts",b.dataset.del));renderProfile(uid,box)}catch(e){toast(errMsg(e))}
      });
    }
  }catch(e){box.innerHTML=`<p class="c" style="padding:40px 20px">${esc(errMsg(e))}</p>`}
}

function editProfile(box){
  $("#sheetBox").innerHTML=`<div class="sheet" style="height:auto;max-height:90%"><div class="h"><b>Modifier mon profil</b><button class="x" id="cx">✕</button></div>
  <div class="l"><div class="c">${avatar(myData.photoURL,myData.username,80)}<br><button class="btn s sm" id="ePhoto" style="margin-top:8px">📷 Changer la photo</button><input type="file" id="eFile" accept="image/*" class="hide"></div>
  <input class="inp" id="eName" value="${esc(myData.username)}" maxlength="20" placeholder="Nom d'utilisateur">
  <textarea class="inp" id="eBio" maxlength="150" placeholder="Description">${esc(myData.bio||"")}</textarea>
  <button class="btn" id="eSave" style="margin-bottom:12px">Enregistrer</button></div></div>`;
  $("#cx").onclick=closeSheet;
  $("#ePhoto").onclick=()=>$("#eFile").click();
  $("#eFile").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const data=await resizeImage(f);await updateDoc(doc(db,"users",me.uid),{photoURL:data});myData.photoURL=data;closeSheet();renderProfile(me.uid,box);toast("Photo mise à jour ✅")}catch(er){toast(errMsg(er))}
  };
  $("#eSave").onclick=async()=>{
    const username=$("#eName").value.trim(), bio=$("#eBio").value.trim();
    if(username.length<3){toast("Nom d'utilisateur : 3 caractères minimum.");return}
    try{await updateDoc(doc(db,"users",me.uid),{username,bio});myData.username=username;myData.bio=bio;closeSheet();renderProfile(me.uid,box);toast("Profil enregistré ✅")}catch(e){toast(errMsg(e))}
  };
}

function openWithdraw(bal,box){
  $("#sheetBox").innerHTML=`<div class="sheet" style="height:auto"><div class="h"><b>Retirer de l'argent</b><button class="x" id="cx">✕</button></div>
  <div class="l"><p class="mut">Solde : ${bal} FCFA</p>
  <select class="inp" id="wM"><option>Orange Money</option><option>Wave</option></select>
  <input class="inp" id="wP" type="tel" placeholder="Ton numéro (ex. 0700000000)">
  <input class="inp" id="wA" type="number" placeholder="Montant en FCFA" value="${bal}">
  <button class="btn" id="wGo" style="margin-bottom:12px">Envoyer la demande</button></div></div>`;
  $("#cx").onclick=closeSheet;
  $("#wGo").onclick=async()=>{
    const amount=Math.floor(Number($("#wA").value)), phone=$("#wP").value.trim(), method=$("#wM").value;
    if(!(amount>=MIN_WITHDRAW)||amount>bal){toast(`Montant entre ${MIN_WITHDRAW} FCFA et ${bal} FCFA.`);return}
    if(phone.replace(/\D/g,"").length<8){toast("Numéro de téléphone non valide.");return}
    try{await addDoc(collection(db,"withdrawals"),{uid:me.uid,username:myData.username||"?",amount,method,phone,status:"En attente",createdAt:serverTimestamp()});closeSheet();toast("Demande envoyée (En attente)");renderProfile(me.uid,box)}catch(e){toast(errMsg(e))}
  };
}

/* ---------- Recherche ---------- */
let usersCache=null, st=null;
$("#sq").oninput=()=>{clearTimeout(st);st=setTimeout(doSearch,300)};
async function doSearch(){
  const q=$("#sq").value.trim().toLowerCase(), out=$("#sres");
  if(!q){out.innerHTML="";return}
  out.innerHTML='<p class="mut c">Recherche…</p>';
  try{
    if(!usersCache)usersCache=(await getDocs(query(collection(db,"users"),limit(300)))).docs.map(d=>({id:d.id,...d.data()}));
    await loadPosts();
    const us=usersCache.filter(u=>(u.username||"").toLowerCase().includes(q.replace(/^@/,"")));
    const vs=posts.filter(p=>descOf(p).toLowerCase().includes(q)||nameOf(p).toLowerCase().includes(q));
    let h="<h4>Créateurs</h4>";
    h+=us.length?us.map(u=>`<div class="row" data-u="${esc(u.id)}">${avatar(u.photoURL,u.username,40)}<div class="g"><div><b>@${esc(u.username)}</b></div></div></div>`).join(""):'<p class="mut">Aucun créateur.</p>';
    h+="<h4>Vidéos</h4>";
    h+=vs.length?vs.slice(0,30).map(p=>`<div class="vid"><video src="${esc(urlOf(p))}" controls playsinline preload="metadata"></video><div style="margin:6px 0;word-break:break-word">${esc(descOf(p))}</div><div class="mut" style="font-size:13px">@${esc(nameOf(p))} · 👁 ${p.views||0}</div></div>`).join(""):'<p class="mut">Aucune vidéo.</p>';
    out.innerHTML=h;
    $$("[data-u]",out).forEach(r=>r.onclick=()=>openUser(r.dataset.u));
  }catch(e){out.innerHTML=`<p class="c">${esc(errMsg(e))}</p>`}
}

/* ---------- Messages privés ---------- */
const chatId=(a,b)=>[a,b].sort().join("_");
async function showInbox(){
  const box=$("#inList");box.innerHTML='<p class="mut c">Chargement…</p>';
  try{
    const s=await getDocs(query(collection(db,"chats"),where("members","array-contains",me.uid)));
    const list=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
    if(!list.length){box.innerHTML='<p class="mut c" style="padding:30px 0">Aucun message. Ouvre le profil d\'un créateur et appuie sur « Message » pour écrire.</p>';return}
    box.innerHTML=list.map(c=>{const other=(c.members||[]).find(x=>x!==me.uid),nm=c.names?.[other]||"Utilisateur";return `<div class="row" data-c="${esc(other)}" data-n="${esc(nm)}">${avatar("",nm,44)}<div class="g"><div><b>@${esc(nm)}</b></div><div class="mut" style="font-size:14px">${esc(c.lastMessage||"")}</div></div></div>`}).join("");
    $$("[data-c]",box).forEach(r=>r.onclick=()=>openChat(r.dataset.c,r.dataset.n));
  }catch(e){box.innerHTML=`<p class="c">${esc(errMsg(e))}</p>`}
}

function openChat(otherUid,otherName){
  if(otherUid===me.uid)return;
  $$(".sec").forEach(s=>s.classList.add("hide"));
  $("#chat").classList.remove("hide");current="chat";
  $("#chName").textContent="@"+otherName;
  const id=chatId(me.uid,otherUid), cref=doc(db,"chats",id), msgs=$("#chatMsgs");
  msgs.innerHTML='<p class="mut c">Chargement…</p>';
  if(chatUnsub)chatUnsub();
  chatUnsub=onSnapshot(query(collection(cref,"messages"),orderBy("createdAt")),s=>{
    msgs.innerHTML=s.empty?'<p class="mut c" style="padding:30px 0">Écris le premier message 👋</p>':s.docs.map(d=>{const m=d.data();return `<div class="bub ${m.from===me.uid?"me":""}">${esc(m.text)}</div>`}).join("");
    msgs.scrollTop=msgs.scrollHeight;
  },e=>{msgs.innerHTML=`<p class="c">${esc(errMsg(e))}</p>`});
  const send=async()=>{
    const t=$("#chIn").value.trim();if(!t)return;$("#chIn").value="";
    try{
      const b=writeBatch(db);
      b.set(cref,{members:[me.uid,otherUid],names:{[me.uid]:myData.username||"?",[otherUid]:otherName},lastMessage:t.slice(0,80),lastFrom:me.uid,updatedAt:serverTimestamp()},{merge:true});
      b.set(doc(collection(cref,"messages")),{from:me.uid,text:t,createdAt:serverTimestamp()});
      await b.commit();
    }catch(e){toast(errMsg(e))}
  };
  $("#chSend").onclick=send;
  $("#chIn").onkeydown=e=>{if(e.key==="Enter")send()};
}
$("#chBack").onclick=()=>go("inbox");

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
