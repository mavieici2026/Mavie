<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma Vie - Propriétaire</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .sous { color: #aaa; font-size: 13px; margin-bottom: 16px; }
  input { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; font-size: 16px; }
  button { padding: 12px 16px; border: 0; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .blanc { background: #fff; color: #000; width: 100%; margin-top: 6px; }
  .gris { background: #333; color: #fff; }
  .vert { background: #1db954; color: #fff; width: 100%; margin-top: 10px; }
  .carte { background: #111; border: 1px solid #333; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .ligne { display: flex; justify-content: space-between; margin: 4px 0; font-size: 15px; }
  .montant { font-size: 20px; font-weight: bold; }
  .etat { padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
  .attente { background: #f5a623; color: #000; }
  .paye { background: #1db954; color: #fff; }
  .erreur { color: #ff6b6b; font-size: 14px; margin: 8px 0; white-space: pre-wrap; }
  .uid { background: #111; border: 1px dashed #666; border-radius: 8px; padding: 10px; font-size: 13px; word-break: break-all; margin: 8px 0; }
  .cache { display: none; }
</style>
</head>
<body>
<h1>MA VIE — Propriétaire</h1>
<div class="sous">Page privée pour payer les retraits</div>

<div id="connexion">
  <h2>Connexion</h2>
  <input id="email" type="email" placeholder="Ton e-mail" autocomplete="username">
  <input id="mdp" type="password" placeholder="Ton mot de passe" autocomplete="current-password">
  <button class="blanc" id="btnConnexion">Se connecter</button>
  <div class="erreur" id="erreurConnexion"></div>
</div>

<div id="espace" class="cache">
  <div class="sous">Ton identifiant (UID) :</div>
  <div class="uid" id="monUid"></div>
  <div class="ligne"><button class="gris" id="btnActualiser">Actualiser</button><button class="gris" id="btnDeconnexion">Déconnexion</button></div>

  <h2>Demandes en attente</h2>
  <div id="listeAttente"></div>

  <h2>Demandes payées</h2>
  <div id="listePayees"></div>

  <div class="erreur" id="erreurListe"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDt_UcyL9pXwvfE-5NpOozMykCJh7zvvrs",
  authDomain: "ma-vie-2b252.firebaseapp.com",
  projectId: "ma-vie-2b252",
  storageBucket: "ma-vie-2b252.firebasestorage.app",
  messagingSenderId: "235933753646",
  appId: "1:235933753646:web:91df8965e68affbf3f9abf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);

function texte(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

$("btnConnexion").onclick = async () => {
  $("erreurConnexion").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("mdp").value);
  } catch (e) {
    $("erreurConnexion").textContent = "Connexion impossible : " + e.code;
  }
};

$("btnDeconnexion").onclick = () => signOut(auth);
$("btnActualiser").onclick = () => charger();

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("connexion").classList.add("cache");
    $("espace").classList.remove("cache");
    $("monUid").textContent = user.uid;
    charger();
  } else {
    $("connexion").classList.remove("cache");
    $("espace").classList.add("cache");
  }
});

function carte(id, d) {
  const paye = d.status === "Payé";
  const div = document.createElement("div");
  div.className = "carte";
  div.innerHTML =
    '<div class="ligne"><span class="montant">' + texte(d.amount) + ' FCFA</span>' +
    '<span class="etat ' + (paye ? "paye" : "attente") + '">' + texte(d.status || "En attente") + '</span></div>' +
    '<div class="ligne"><span>Créateur</span><span>@' + texte(d.username) + '</span></div>' +
    '<div class="ligne"><span>Méthode</span><span>' + texte(d.method) + '</span></div>' +
    '<div class="ligne"><span>Numéro</span><span>' + texte(d.phone) + '</span></div>';
  if (!paye) {
    const b = document.createElement("button");
    b.className = "vert";
    b.textContent = "Marquer comme Payé";
    b.onclick = async () => {
      if (!confirm("Tu as bien envoyé " + d.amount + " FCFA à " + d.phone + " ?")) return;
      b.disabled = true;
      try {
        await updateDoc(doc(db, "withdrawals", id), { status: "Payé" });
        charger();
      } catch (e) {
        $("erreurListe").textContent = "Impossible de modifier : " + e.code;
        b.disabled = false;
      }
    };
    div.appendChild(b);
  }
  return div;
}

async function charger() {
  $("erreurListe").textContent = "";
  $("listeAttente").innerHTML = "";
  $("listePayees").innerHTML = "";
  try {
    const snap = await getDocs(collection(db, "withdrawals"));
    const items = [];
    snap.forEach((s) => items.push({ id: s.id, d: s.data() }));
    items.sort((a, b) => {
      const ta = a.d.createdAt && a.d.createdAt.seconds ? a.d.createdAt.seconds : 0;
      const tb = b.d.createdAt && b.d.createdAt.seconds ? b.d.createdAt.seconds : 0;
      return tb - ta;
    });
    let nbA = 0, nbP = 0;
    items.forEach((it) => {
      if (it.d.status === "Payé") { $("listePayees").appendChild(carte(it.id, it.d)); nbP++; }
      else { $("listeAttente").appendChild(carte(it.id, it.d)); nbA++; }
    });
    if (nbA === 0) $("listeAttente").innerHTML = '<div class="sous">Aucune demande en attente.</div>';
    if (nbP === 0) $("listePayees").innerHTML = '<div class="sous">Aucune demande payée.</div>';
  } catch (e) {
    $("erreurListe").textContent = "Impossible de lire les demandes : " + e.code +
      "\n(Normal si les règles Firestore ne sont pas encore changées pour le propriétaire.)";
  }
}
</script>
</body>
</html>
